[coverage:run]
source =
  custom_components

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplemented()
    if __name__ == '__main__':
    main()
#fail_under = 85
show_missing = true

[tool:pytest]
pythonpath = .
testpaths = tests
norecursedirs = .git
asyncio_mode = auto
addopts =
    --strict-markers
    --cov=custom_components


[mypy]
python_version = 3.13
follow_imports = silent
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
